theme: minima
title: OpticAlpha Terminal Documentation
description: Technical reference for the OpticAlpha real-time market data terminal: 13 live channels covering options flow, GEX, crypto, forex, macro, and Kalshi prediction markets.
url: "https://docs.opticalpha.net"
baseurl: ""

author:
  name: OpticAlpha
  twitter: opticalpha870

image: https://opticalpha.net/img/og-image.png
favicon: https://opticalpha.net/img/opticalpha.webp

twitter:
  card: summary_large_image
  username: opticalpha870

# jekyll-seo-tag (GitHub Pages version) only reads page-level `image`,
# not site.image — so inject it into every page's front matter.
# width/height intentionally omitted to avoid stale dims if the image changes.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: https://opticalpha.net/img/og-image.png
        alt: "OpticAlpha market data terminal: options flow, GEX, crypto liquidation maps, CFTC COT and FRED macro indicators"

plugins:
  - jekyll-sitemap

# Explicit nav order (default is alphabetical, which buries the glossary last).
header_pages:
  - docs/glossary.md
  - docs/faq.md
  - docs/data-sources.md
  - docs/channel-comparison.md
